[project]
name = "steeldraw"
license = "MIT"
version = "0.1.0"
description = "Çelik yapı bağlantı/birleşim detaylarının programatik DXF üreteci (AISC + Eurocode)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
